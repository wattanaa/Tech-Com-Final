# ════════════════════════════════════════════════════════════════
#  Render.com Blueprint — deploy ขึ้นคลาวด์แบบกดปุ่มเดียว
#
#  หมายเหตุ: ถ้าบริการขึ้นว่า "suspended" ใน Render dashboard ต้องกด
#  Resume เองก่อน (มักเกิดจากไม่มีการใช้งานนานหรือเกิน free-tier quota)
#  ดูขั้นตอนเต็มใน docs/DEPLOY.md ตัวเลือก B
# ════════════════════════════════════════════════════════════════

databases:
  - name: tcom-db
    databaseName: tcom_db
    user: tcom
    plan: free
    region: singapore

services:
  # ── Backend API (Docker) ──
  - type: web
    name: tcom-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: tcom-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_NAME
        value: tcom.sid
      - key: SEED_MODE
        value: demo
      - key: SEED_ADMIN_EMAIL
        value: admin@tcom.rtc.ac.th
      - key: SEED_ADMIN_PASSWORD
        generateValue: true          # ให้ Render สุ่มรหัสผ่านเริ่มต้นให้เลยเพื่อไม่ให้บล็อกการ deploy
      - key: SEED_ADMIN_NAME
        value: ผู้ดูแลระบบ
      - key: CORS_ORIGIN
        value: https://tcom-web-x196.onrender.com   # ต้องตรงกับ URL จริงของบริการ tcom-web เป๊ะ — Render เติมหางสุ่มเพราะชื่อ tcom-web ถูกใช้ไปแล้ว

  # ── Frontend (Static Site) ──
  - type: web
    name: tcom-web
    runtime: static
    rootDir: ./frontend
    buildCommand: npm install --ignore-scripts && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://tcom-api-x196.onrender.com/api/v1   # Render เติมหางสุ่มเพราะชื่อ tcom-api ถูกใช้ไปแล้ว
    routes:
      - type: rewrite
        source: /*
        destination: /index.html