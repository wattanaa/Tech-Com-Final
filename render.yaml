# ════════════════════════════════════════════════════════════════
#  Render.com Blueprint — deploy ขึ้นคลาวด์แบบกดปุ่มเดียว
#
#  DEPRECATED: ย้ายไปใช้ Fly.io แล้ว (ดู backend/fly.toml, frontend/fly.toml,
#  docs/DEPLOY.md ตัวเลือก B) เพราะ Render free tier ระงับบริการเองเมื่อไม่ใช้นาน ๆ
#  และไฟล์อัปโหลดไม่ถาวร — เก็บไฟล์นี้ไว้เผื่ออ้างอิงเท่านั้น ไม่ได้ดูแลต่อ
# ════════════════════════════════════════════════════════════════

databases:
  - name: tcom-db
    databaseName: tcom_db
    user: tcom
    plan: free
    region: singapore

services:
  # ── Backend API (Docker) ──
  - type: web
    name: tcom-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: tcom-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_NAME
        value: tcom.sid
      - key: SEED_MODE
        value: demo
      - key: SEED_ADMIN_EMAIL
        value: admin@tcom.rtc.ac.th
      - key: SEED_ADMIN_PASSWORD
        generateValue: true          # ให้ Render สุ่มรหัสผ่านเริ่มต้นให้เลยเพื่อไม่ให้บล็อกการ deploy
      - key: SEED_ADMIN_NAME
        value: ผู้ดูแลระบบ
      - key: CORS_ORIGIN
        value: "*"                    # ตั้ง * ไว้ก่อนชั่วคราวเพื่อให้รันผ่าน แล้วค่อยมาแก้เป็น URL frontend ทีหลัง

  # ── Frontend (Static Site) ──
  - type: web
    name: tcom-web
    runtime: static
    rootDir: ./frontend
    buildCommand: npm install --ignore-scripts && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://tcom-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html